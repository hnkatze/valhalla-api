name: valhalla-api

# Single place to bump the Valhalla version. Tiles must be rebuilt after a bump.
x-valhalla-image: &valhalla-image ghcr.io/valhalla/valhalla-scripted:3.8.3

services:
  # --- runtime profile: serve pre-built tiles pulled from S3 -------------------------------
  valhalla:
    image: *valhalla-image
    profiles: ["runtime"]
    restart: unless-stopped
    volumes:
      - ./custom_files:/custom_files
    environment:
      use_tiles_ignore_pbf: "True"
      serve_tiles: "True"
      force_rebuild: "False"
      build_elevation: "False"
      build_transit: "False"
      # Admin/timezone data is baked into the tiles at build time; a missing DB on the
      # runtime host must never trigger a rebuild, which has no PBF and would only crash-loop.
      build_admins: "False"
      build_time_zones: "False"
      use_default_speeds_config: "False"
      update_existing_config: "True"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  nginx:
    image: nginx:1.30-alpine
    profiles: ["runtime"]
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    environment:
      VALHALLA_API_KEY: ${VALHALLA_API_KEY:?VALHALLA_API_KEY must be set in .env}
      # Source of trusted X-Forwarded-For headers, so nginx can recover the real client IP
      # behind a load balancer. Loopback is a no-op default for a host reached directly; on
      # AWS this is the VPC CIDR.
      VALHALLA_TRUSTED_PROXY_CIDR: ${VALHALLA_TRUSTED_PROXY_CIDR:-127.0.0.1}
      # Upstreams y resolver: aqui son nombres de servicio y el DNS embebido de Docker. La
      # imagen de ECS trae sus propios valores por ENV (localhost), asi que el template es el
      # mismo en los dos entornos.
      VALHALLA_RESOLVER: 127.0.0.11
      VALHALLA_UPSTREAM: http://valhalla:8002
      VALHALLA_DOCS_UPSTREAM: http://swagger-ui:8080
      # Restrict envsubst to our variables so nginx's own $host, $http_* etc. survive rendering.
      NGINX_ENVSUBST_FILTER: "^VALHALLA_"
    depends_on:
      valhalla:
        condition: service_healthy
      swagger-ui:
        condition: service_started

  # Public API docs, reachable only through nginx at /swagger/. The spec is versioned in the repo
  # (scripts/sync-openapi.sh regenerates it), so the host needs no network access at boot.
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.33.0
    profiles: ["runtime"]
    restart: unless-stopped
    volumes:
      - ./docs/openapi.yaml:/spec/openapi.yaml:ro
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      BASE_URL: /swagger
      TRY_IT_OUT_ENABLED: "true"
      PERSIST_AUTHORIZATION: "true"

  # --- build profile: one-off tile build, container exits when done -------------------------
  valhalla-build:
    image: *valhalla-image
    profiles: ["build"]
    volumes:
      - ./custom_files:/custom_files
    environment:
      tile_urls: ${VALHALLA_TILE_URLS:-https://download.geofabrik.de/central-america/honduras-latest.osm.pbf}
      serve_tiles: "False"
      use_tiles_ignore_pbf: "False"
      force_rebuild: "True"
      build_tar: "True"
      build_elevation: "False"
      build_transit: "False"
      build_admins: "True"
      build_time_zones: "True"
      use_default_speeds_config: "True"
      update_existing_config: "True"
