# Swagger UI servido como archivos estaticos en un server interno, en lugar del contenedor
# swaggerapi/swagger-ui que usa compose. Escucha en el mismo puerto que ese contenedor
# (127.0.0.1:8080), asi que default.conf.template no cambia entre los dos entornos: solo
# cambia el valor de VALHALLA_DOCS_UPSTREAM.
#
# Evita un tercer proceso dentro del contenedor: nginx ya esta corriendo de todas formas.
server {
    listen 127.0.0.1:8080;
    server_tokens off;
    access_log off;

    location /docs/ {
        alias /usr/share/nginx/swagger/;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
